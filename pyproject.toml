[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "findata"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "edgartools",
    "yahooquery",
    "sqlalchemy",
    "tqdm",
    "numpy",
    "pandas",
    "seaborn",
    "matplotlib",
    "scikit-learn"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["findata*"]
